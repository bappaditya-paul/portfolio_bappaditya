services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: bappaditya-portfolio:latest
    container_name: bappaditya-portfolio
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
    # Static assets (music, images) are baked into the image.
    # No external API secrets needed — Spotify API removed in favour of local music.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
